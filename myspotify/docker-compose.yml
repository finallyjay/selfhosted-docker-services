services:
  myspotify-backend:
    image: yooooomi/your_spotify_server:latest
    container_name: myspotify-api
    hostname: myspotify-api
    restart: unless-stopped
    depends_on:
      myspotify-mongo:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: wget --spider --quiet http://localhost:8080 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      API_ENDPOINT: https://${MYSPOTIFY_BACKEND_DOMAIN}
      CLIENT_ENDPOINT: https://${MYSPOTIFY_DOMAIN}
      MONGO_ENDPOINT: mongodb://${MYSPOTIFY_MONGO_USER:?MYSPOTIFY_MONGO_USER is required}:${MYSPOTIFY_MONGO_PASSWORD:?MYSPOTIFY_MONGO_PASSWORD is required}@myspotify-mongo:27017/your_spotify?authSource=admin
      SPOTIFY_PUBLIC: ${MYSPOTIFY_APP_PUBLIC}
      SPOTIFY_SECRET: ${MYSPOTIFY_APP_SECRET}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=true

  myspotify-mongo:
    image: mongo:8
    container_name: myspotify-mongo
    hostname: myspotify-mongo
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: mongosh --eval 'db.runCommand("ping").ok' --quiet || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - myspotify-mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MYSPOTIFY_MONGO_USER:?MYSPOTIFY_MONGO_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MYSPOTIFY_MONGO_PASSWORD:?MYSPOTIFY_MONGO_PASSWORD is required}
      # MongoDB 8 refuses to start on kernel >= 6.19 unless it is 7.0.14+;
      # Ubuntu HWE reports 7.0.0-N, so it is rejected. See README.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=true

  myspotify-frontend:
    image: yooooomi/your_spotify_client:latest
    container_name: myspotify-frontend
    hostname: myspotify-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: wget --spider --quiet http://127.0.0.1:3000 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      API_ENDPOINT: https://${MYSPOTIFY_BACKEND_DOMAIN}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=true

volumes:
  myspotify-mongo-data:
