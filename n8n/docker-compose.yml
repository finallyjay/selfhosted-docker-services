services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    user: ${N8N_USER}
    security_opt:
      - no-new-privileges:true
    ports:
      - "${N8N_PORT}:5678"
    volumes:
      - n8n-data:/data
      # n8n regenerates its UI cache on start: keep it out of the data volume
      - n8n-cache:/data/.cache
    environment:
      HOME: /data
      TZ: ${TZ}
      GENERIC_TIMEZONE: ${TZ}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE}
      DB_SQLITE_POOL_SIZE: 5
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=true

volumes:
  n8n-data:
  n8n-cache:
