services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${N8N_PORT}:5678"
    volumes:
      - n8n-data:/data
      # n8n regenerates its UI cache on start: keep it out of the data volume
      - n8n-cache:/data/.cache
    environment:
      HOME: /data
      TZ: ${TZ}
      GENERIC_TIMEZONE: ${TZ}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE}
      # Public base URL for webhooks (without it n8n appends :5678)
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:?N8N_WEBHOOK_URL is required}
      DB_SQLITE_POOL_SIZE: 5
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      # Nodes disabled on this instance. Default: n8n's own defaults
      # (Execute Command and Local File Trigger). An instance that runs git
      # for the GitHub backups sets '["n8n-nodes-base.localFileTrigger"]'.
      NODES_EXCLUDE: ${N8N_NODES_EXCLUDE:-["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger"]}
      # Nodes that read or write files can only use this scratch folder
      N8N_RESTRICT_FILE_ACCESS_TO: /tmp/github-bundles
      # Read-only GitHub token for "git clone --mirror" (optional)
      GITHUB_BACKUP_TOKEN: ${N8N_GITHUB_BACKUP_TOKEN:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=true

volumes:
  n8n-data:
  n8n-cache:
